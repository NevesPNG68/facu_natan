const frame=document.getElementById('quiz');
const buttons={empresarial:document.getElementById('btnEmp'),humanos:document.getElementById('btnDh')};
function openQuiz(which){
  const bytes=Uint8Array.from(atob(pages[which]),c=>c.charCodeAt(0));
  let source=new TextDecoder('utf-8').decode(bytes);
  const bridge='<script>(function(){function send(){parent.postMessage({quizFrameHeight:Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0)},"*")}window.addEventListener("load",send);if(window.ResizeObserver)new ResizeObserver(send).observe(document.documentElement);new MutationObserver(send).observe(document.documentElement,{subtree:true,childList:true,attributes:true});setInterval(send,1000);setTimeout(send,150);setTimeout(send,700)})();<\/script>';
  if(/<\/body\s*>/i.test(source)) source=source.replace(/<\/body\s*>/i,bridge+'</body>'); else source=source.replace(/<\/html\s*>/i,bridge+'</html>');
  frame.title=which==='empresarial'?'Simulado de Direito Empresarial':'Simulado de Direitos Humanos';
  frame.srcdoc=source;
  for(const name of Object.keys(buttons)) buttons[name].setAttribute('aria-selected',String(name===which));
}
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data&&Number.isFinite(event.data.quizFrameHeight)){frame.style.height=Math.max(450,event.data.quizFrameHeight+8)+'px'}});
buttons.empresarial.addEventListener('click',()=>openQuiz('empresarial'));
buttons.humanos.addEventListener('click',()=>openQuiz('humanos'));
openQuiz('empresarial');
</script>
